name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: node --check index.js

      # Globbed on purpose. This was a hand-maintained list of `node test/x.test.js`
      # lines, which failed twice over:
      #   1. A test file nobody remembered to add here never ran. Silent, and the
      #      file looks like coverage while asserting nothing in CI.
      #   2. It serialised every parallel session — two sessions each appending a
      #      test file conflict on this exact block, and in a repo where tasks/*.md
      #      is merge=union that is enough to make GitHub call a PR conflicted and
      #      skip CI entirely.
      # Fails closed if the glob matches nothing, since "no tests ran" and "all
      # tests passed" are otherwise indistinguishable in a green check.
      - name: Tests (no install needed — plain node)
        run: |
          shopt -s nullglob
          files=(test/*.test.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No test files matched test/*.test.js — the suite did not run."
            exit 1
          fi
          echo "Running ${#files[@]} test file(s)"
          failed=0
          for f in "${files[@]}"; do
            echo "── $f"
            node "$f" || { echo "::error file=$f::$f failed"; failed=1; }
          done
          exit $failed

      # A "docs" branch that touches index.js is the 2026-05-26 failure mode:
      # a docs-only session committing a stale copy of the monolith.
      - name: Docs-branch guard
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/${BASE}...HEAD")
          if { [[ "$BRANCH" == docs/* ]] || [[ "$TITLE" == docs:* ]]; } && echo "$CHANGED" | grep -qx 'index.js'; then
            echo "::error::A docs branch modifies index.js — likely a stale working copy. Split the code change into its own branch."
            exit 1
          fi

      # tasks/*.md carries merge=union so parallel sessions can both append. Git
      # honours that; GitHub's merge engine does NOT honour gitattributes merge
      # drivers. So the moment another session appends to the same file, GitHub
      # calls this PR CONFLICTING — and a conflicted PR does not run checks at all.
      # PR #59 sat a full day that way, showing "no checks reported", entirely
      # untested, while nothing was actually wrong with it.
      #
      # A warning, not a failure: updating tasks/project-state.md alongside an
      # infrastructure change is the documented convention, and blocking it would
      # fight that. The point is that the author knows the trade before it bites.
      - name: Docs-append-in-code-PR notice
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/${BASE}...HEAD")
          CODE=$(echo "$CHANGED" | grep -E '^(index\.js|lib/|test/)' || true)
          DOCS=$(echo "$CHANGED" | grep -E '^tasks/.*\.md$' || true)
          if [ -n "$CODE" ] && [ -n "$DOCS" ]; then
            echo "::warning::This PR changes code AND tasks/*.md. Those files are merge=union, which git honours but GitHub does not — if another session appends to the same file before this merges, GitHub will mark this PR CONFLICTING and silently stop running CI on it. If that happens: 'git merge-tree' shows the real conflict count, and moving the docs into a follow-up docs/* PR unblocks it. Files: $(echo $DOCS | tr '\n' ' ')"
          fi

      # Large deletions from the monolith usually mean a stale copy is reverting
      # someone else's merged work. Intentional big changes: add label major-change.
      - name: Revert detector (index.js deletions)
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.base_ref }}
        run: |
          DELETED=$(git diff --numstat "origin/${BASE}...HEAD" -- index.js | awk '{s+=$2} END {print s+0}')
          echo "index.js lines deleted vs base: ${DELETED}"
          if [ "${DELETED}" -gt 50 ] && [[ ",${LABELS}," != *",major-change,"* ]]; then
            echo "::error::This PR deletes ${DELETED} lines from index.js without the 'major-change' label. If intentional, add the label; if not, your branch likely holds a stale copy of index.js."
            exit 1
          fi
